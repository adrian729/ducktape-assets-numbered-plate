id: plate-34-nested-fans
title: Nested loop vertical border
description: A vertical border repeat of tightly nested hairlines in dark olive, cream and dark red that bend into a column of heart-shaped loops, each loop opening downward around the one below it like fingerprint ridges, with narrower loops filling the sides; a brown-red rule runs down each side. The ridges continue across the top and bottom edges when repeated. Opaque, no transparent background.
