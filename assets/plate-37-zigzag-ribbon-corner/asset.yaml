id: plate-37-zigzag-ribbon-corner
title: Zigzag ribbon corner, top-left
description: An L-shaped top-left corner with two arms of equal length. Wide gold-ochre bands run along the outside and inside of each arm; between them a dark red band carries a blue zigzag ribbon edged in cream and tan with a tan C-scroll in every triangle it leaves, and at the vertex a fan of five cream and black darts radiating out of the angle. The inside of the L is transparent.
