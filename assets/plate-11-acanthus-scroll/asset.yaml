title: Acanthus wave scroll
description: A long horizontal strip, more than five times wider than tall. A gold stem rolls in two waves along the strip, throwing off dark green acanthus leaves edged in white, with red tongue-like leaflets, small white dots and a gold spiral at each crest, on an opaque dark maroon ground. Both ends are cut by the plate edge. Nothing is transparent.
