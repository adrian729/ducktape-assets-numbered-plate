title: Stacked shell palmette vertical border
description: A vertical border repeat, a stack of four overlapping shell-shaped palmettes with radiating ribs and a cream central tongue, their colours changing down the strip from blue to orange and dark red, to gold and blue, to olive grey, with small cream dots in the spandrels between them; orange-red rules edged in cream run down both sides. The stack continues across the top and bottom edges when repeated. Opaque, no transparent background.
