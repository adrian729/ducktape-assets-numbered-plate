title: Dark petal cross border cell
description: One repeat of a border, a cream square panel holding four dark red pointed petals on the diagonals and a thin orange cross of rods with knobbed ends between them, a small cream ring at the centre; to its left a narrow dark red bar with a cream C-curl at each end and a small gold ring in the middle. Orange-red rules run along the top and bottom. The cell chains when repeated. Opaque, no transparent background.
