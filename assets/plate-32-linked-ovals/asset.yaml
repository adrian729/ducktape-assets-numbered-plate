title: Linked oval border cell
description: One repeat of a border, a chain of rings made of paired C-shaped arcs edged in cream, red arcs on the outer ring and blue arcs on the next, each ring holding an upright oval with a tan centre and an orange rim, and small tan squares linking the rings; dark red ground with a faint olive pattern, orange rules along the top and bottom. Two rings wide, cut through the rings at both sides so the chain continues when repeated. Opaque, no transparent background.
