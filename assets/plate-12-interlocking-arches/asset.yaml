title: Interlocking arches with striped lunettes
description: One repeat of a border strip, wider than tall. White arcs cross one another to form interlocking circles; the two central half-circles are filled with gold and green stripes, the outer ones with dark red and black bands, and small white dots fill the pointed spaces between the arcs, on an opaque ground. Nothing is transparent.
