# descriptive: find it and understand it
id: plate-29-red-acanthus
title: Red acanthus stem vertical border
description: A vertical border repeat, an undulating orange stem outlined in dark red winding up the strip with dark red acanthus fronds springing from it on both sides, two small blue trefoil flowers edged in orange at the bends and small cream ring beads on the stem, over a mottled tan and olive ground. Four times taller than wide; the stem crosses the top and bottom edges so the strip joins when stacked. Opaque, no transparent background.
