id: plate-36-greek-key-corner
title: Greek key corner, top-left
description: An L-shaped top-left corner with two arms of equal length. The outer band is blue with a running cream and gold wave scroll; the inner band is dark olive green with a row of red Greek key cells, each a square meander; thin orange-red rules edged in cream separate the bands and close the edges, and a diagonal mitre joins the two arms at the vertex. The inside of the L is transparent.
