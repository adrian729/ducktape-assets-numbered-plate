# descriptive: find it and understand it
id: plate-17-stepped-arches
title: Stepped meander with crescents
description: One repeat of a border strip, about twice as wide as tall. Gold,
  blue and green bands step up and down in interlocking stepped arches, a gold
  crescent over a white one hanging in the upper arch and a green ring over a
  white crescent standing in the lower one, on an opaque dark maroon ground with
  a thin gold rule along the top edge. Nothing is transparent.
