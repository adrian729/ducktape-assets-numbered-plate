id: plate-33-leaf-scrolls
title: Scrolling stem vertical border
description: A vertical border repeat on cream, a symmetrical pair of dark olive-brown stems that fork from the centre line into two inward volutes at the bottom and two outward curls with dark red tips higher up, small dark red dashes between them, and a blue three-lobed leaf in each upper corner; a dark red rule runs down each side. The stems continue across the top and bottom edges when repeated. Opaque, no transparent background.
