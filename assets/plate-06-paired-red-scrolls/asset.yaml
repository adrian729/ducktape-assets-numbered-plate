id: plate-06-paired-red-scrolls
title: Red scroll cartouches on dark red
description: One repeat of a long border strip, about three and a half times wider than tall. Two pointed-oval cartouches outlined in bright red are filled with symmetrical red C-scrolls and spirals around dark olive quatrefoils; a small white-ringed boss sits between them, with olive scroll tufts above and below it and olive discs in the four corners, on an opaque dark maroon ground. Nothing is transparent.
